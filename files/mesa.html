<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pedido - CenaduriaPOS Lite</title>

  <link rel="stylesheet" href="estilos.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8590c" />
</head>
<body>

  <header>
    <div class="top-mesa">
      <button class="btn-volver" onclick="window.location.href='index.html'">← Cuentas</button>
      <h1 id="nombreCuenta">Cuenta</h1>
      <span style="width:60px"></span>
    </div>
  </header>

  <div class="contenedor">

    <div class="seccion-titulo">Menú</div>
    <div id="productos">
      <!-- Botones del menú generados por mostrarProductos() -->
    </div>

    <div class="panel-carrito">
      <h2>🧾 Pedido actual</h2>
      <div id="carrito">
        <!-- Items del carrito generados por actualizarCarrito() -->
      </div>
      <div class="total-bar">
        <span>TOTAL</span>
        <span id="total">$0</span>
      </div>
      <div class="acciones-mesa">
        <button class="btn-cancelar" onclick="cancelarCuenta()">Cancelar</button>
        <button class="btn-cobrar" onclick="cobrarCuenta()">💰 Cobrar</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    iniciarMesa();
  </script>
</body>
</html>
